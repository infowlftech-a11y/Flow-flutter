# `name` is the Dart package identifier behind every `package:flow/...`
# import — it must stay lowercase and is not the user-facing app name. The
# display name is `Flow`, set in AndroidManifest (android:label) and
# MaterialApp.title. Application id: com.wlftech.flow.
name: flow
description: "Flow — kitesurfing lessons on the Red Sea. Find certified trainers, book hours on the water, check in with a QR ticket."
publish_to: 'none'

# First public release. `versionName` 1.0.0, `versionCode` 1 — the Android
# build reads both from here via flutter.versionName / flutter.versionCode.
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.2
  go_router: ^17.3.0
  firebase_core: ^4.12.1
  firebase_auth: ^6.5.6
  cloud_firestore: ^6.7.1
  firebase_storage: ^13.4.5
  firebase_messaging: ^16.4.3
  shared_preferences: ^2.5.5
  image_picker: ^1.2.3
  mobile_scanner: ^7.4.0
  qr_flutter: ^4.1.0
  url_launcher: ^6.3.2
  material_symbols_icons: ^4.2960.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Drives the real app on a real device. The widget suite renders components
  # in isolation and cannot answer "does this screen look right against live
  # Firestore data" — which is where every defect in the redesign was found.
  integration_test:
    sdk: flutter
  # Only for the driver's TimelineSummary — turns a --profile walkthrough into
  # frame build/raster percentiles instead of an impression.
  flutter_driver:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_cloud_firestore: ^4.2.0
  flutter_launcher_icons: ^0.14.4
  image: ^4.9.1

# Launcher icon. Regenerate with:
#   dart run tool/make_icon_foreground.dart   # only if icon.png changes
#   dart run flutter_launcher_icons
#
# Two layers, because Android 8+ masks the icon itself and guarantees only
# the centre 66 of 108dp. `icon.png` is a finished legacy icon — its own
# rounded square, its own border ring, artwork out to 97% of the width — so
# it is used as-is for the legacy mipmaps and stripped down for the adaptive
# foreground, or the launcher would clip the swoosh and stamp a sticker edge
# around the square. The background is the source's own mean navy, measured
# rather than picked, so the foreground's antialiasing blends into it.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/brand/icon_legacy.png"
  adaptive_icon_background: "#000C25"
  adaptive_icon_foreground: "assets/brand/icon_foreground.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - assets/brand/

  # Variable fonts — weight is selected with FontVariation('wght', …) in the
  # theme (see lib/core/theme/typography.dart), so one file covers all weights.
  fonts:
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
